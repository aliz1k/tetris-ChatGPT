
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b16" />
    <title>Neon Blocks — Tetris</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div>
          <div class="eyebrow">ARCADE / 001</div>
          <h1>NEON<span>BLOCKS</span></h1>
        </div>
        <button id="pauseBtn" class="utility" aria-label="Pause game">
          Ⅱ
        </button>
      </header>

      <div id="game"></div>

      <nav class="controls" aria-label="Game controls">
        <div class="move-row">
          <button class="control secondary" data-action="left"
            aria-label="Move left">←</button>
          <button class="control secondary" data-action="down"
            aria-label="Soft drop">↓</button>
          <button class="control secondary" data-action="right"
            aria-label="Move right">→</button>
        </div>
        <div class="action-row">
          <button class="control rotate" data-action="rotate"
            aria-label="Rotate piece">↻ <small>ROTATE</small></button>
          <button class="control drop" data-action="hardDrop"
            aria-label="Hard drop">⇊ <small>HARD DROP</small></button>
        </div>
      </nav>

      <footer>BUILT FOR THE NEXT HIGH SCORE <span>◆</span></footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
